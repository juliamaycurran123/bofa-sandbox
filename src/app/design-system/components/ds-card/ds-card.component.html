<mat-card [class.ds-card--flat]="!elevated" [class.ds-card--sm]="padding === 'sm'" [class.ds-card--lg]="padding === 'lg'">
  @if (title) {
    <mat-card-header>
      <mat-card-title>{{ title }}</mat-card-title>
      @if (subtitle) {
        <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
      }
    </mat-card-header>
  }
  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
