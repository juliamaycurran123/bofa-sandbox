<button
  mat-raised-button
  [color]="matColor"
  [disabled]="disabled || loading"
  [type]="type"
  [attr.aria-label]="ariaLabel"
  [class.ds-btn--sm]="size === 'sm'"
  [class.ds-btn--lg]="size === 'lg'"
  (click)="onClick($event)"
>
  @if (loading) {
    <mat-spinner diameter="16" class="ds-btn__spinner"></mat-spinner>
  } @else {
    <ng-content></ng-content>
  }
</button>
