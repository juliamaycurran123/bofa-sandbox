<ds-page-header title="Make a Transfer" subtitle="Move money between your accounts"></ds-page-header>

<ds-card>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!mfaRequired">
    <mat-form-field appearance="outline" class="cv-transfer__field">
      <mat-label>From</mat-label>
      <mat-select formControlName="fromAccountId">
        <mat-option *ngFor="let a of accounts" [value]="a.accountId">
          {{ a.nickname }} •••• {{ a.mask }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="cv-transfer__field">
      <mat-label>To</mat-label>
      <mat-select formControlName="toAccountId">
        <mat-option *ngFor="let a of accounts" [value]="a.accountId">
          {{ a.nickname }} •••• {{ a.mask }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="cv-transfer__field">
      <mat-label>Amount</mat-label>
      <input matInput type="number" formControlName="amount" min="0.01" step="0.01">
      <span matPrefix>$&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline" class="cv-transfer__field">
      <mat-label>Memo (optional)</mat-label>
      <input matInput formControlName="memo" maxlength="80">
    </mat-form-field>

    <ds-button type="submit" variant="primary" [disabled]="form.invalid || submitting" [loading]="submitting">
      Continue
    </ds-button>
  </form>

  <div *ngIf="mfaRequired" class="cv-transfer__mfa">
    <h3>Verify it's you</h3>
    <p>We sent a 6-digit code to your phone. Enter it below to complete the transfer.</p>
    <mat-form-field appearance="outline" class="cv-transfer__field">
      <mat-label>Verification code</mat-label>
      <input matInput [(ngModel)]="mfaCode" maxlength="6" inputmode="numeric">
    </mat-form-field>
    <ds-button variant="primary" (pressed)="verifyMfa()" [disabled]="mfaCode.length !== 6 || submitting" [loading]="submitting">
      Verify and submit
    </ds-button>
  </div>
</ds-card>
